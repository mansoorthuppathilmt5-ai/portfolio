
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Zone | Football Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">⚽ FOOTBALL ZONE</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="login.html">Login</a>
    <a href="admin.html">Admin</a>
    <a href="#cart">Cart 🛒 <span id="cartCount">0</span></a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h1>PLAY LIKE A CHAMPION</h1>
    <p>Premium Football Products at Best Prices</p>
    <a href="#products" class="btn">SHOP NOW</a>
  </div>
</section>

<section class="categories">
  <h2>Shop Categories</h2>
  <div class="category-list">
    <button onclick="filterProducts('All')">All</button>
    <button onclick="filterProducts('Jerseys')">Jerseys</button>
    <button onclick="filterProducts('Boots')">Boots</button>
    <button onclick="filterProducts('Footballs')">Footballs</button>
    <button onclick="filterProducts('Accessories')">Accessories</button>
  </div>
</section>

<section class="shop" id="products">
  <h2>Our Products</h2>
  <input type="text" id="search"
    placeholder="Search football products..."
    oninput="searchProducts()">

  <div class="product-grid" id="productGrid"></div>
</section>

<section class="cart-section" id="cart">
  <h2>Shopping Cart 🛒</h2>
  <div id="cartItems"></div>
  <h3 id="total">Total: ₹0</h3>
  <button class="btn" onclick="goCheckout()">
    Proceed to Checkout
  </button>
</section>

<footer>
  <h2>⚽ FOOTBALL ZONE</h2>
  <p>Your Ultimate Football Shopping Destination</p>
  <p>© 2026 Football Zone. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
